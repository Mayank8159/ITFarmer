version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itfarm-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - BACKEND_URL=${BACKEND_URL:-}
    env_file:
      - .env
    volumes:
      # Mount code for hot-reload during development
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - itfarm-network

  # Optional: MongoDB (if you want local development without Atlas)
  # Uncomment if you want to run MongoDB locally in Docker
  # mongodb:
  #   image: mongo:7.0
  #   container_name: itfarm-mongo
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME=admin
  #     - MONGO_INITDB_ROOT_PASSWORD=password
  #     - MONGO_INITDB_DATABASE=itfarm
  #   volumes:
  #     - mongodb_data:/data/db
  #   networks:
  #     - itfarm-network

networks:
  itfarm-network:
    driver: bridge

