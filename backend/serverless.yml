service: itfarmer-backend

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: prod
  deploymentMethod: direct
  environment:
    CONTENT_BUCKET: !Ref ContentBucket
    INQUIRIES_TABLE: !Ref InquiriesTable
    GROQ_API_KEY: ${ssm:/itfarmer/GROQ_API_KEY}
    ADMIN_PASSWORD: ${ssm:/itfarmer/ADMIN_PASSWORD}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:ListBucket
      Resource:
        - !GetAtt ContentBucket.Arn
        - !Sub "${ContentBucket.Arn}/*"
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:DeleteItem
        - dynamodb:BatchWriteItem
        - dynamodb:Scan
        - dynamodb:Query
      Resource:
        - !GetAtt InquiriesTable.Arn

package:
  individually: true
  patterns:
    - "!node_modules/**"
    - "!seed/**"
    - "!package*.json"
    - "!README.md"

functions:
  chat:
    handler: src/chat.handler
    events:
      - http:
          path: chat
          method: post
          cors: true
  dataGet:
    handler: src/data.getFile
    events:
      - http:
          path: data/{file}
          method: get
          cors: true
  dataSave:
    handler: src/data.saveFile
    events:
      - http:
          path: data/{file}
          method: put
          cors: true
  inquiryList:
    handler: src/inquiries.list
    events:
      - http:
          path: inquiries
          method: get
          cors: true
  inquirySubmit:
    handler: src/inquiries.submit
    events:
      - http:
          path: inquiries
          method: post
          cors: true
  inquiryClear:
    handler: src/inquiries.clear
    events:
      - http:
          path: inquiries
          method: delete
          cors: true
  inquiryDelete:
    handler: src/inquiries.remove
    events:
      - http:
          path: inquiries/{id}
          method: delete
          cors: true
  adminAuth:
    handler: src/auth.handler
    events:
      - http:
          path: auth
          method: post
          cors: true

resources:
  Resources:
    ContentBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: itfarmer-content-${self:provider.stage}-${aws:accountId}
        VersioningConfiguration:
          Status: Enabled
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - "*"
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
                - HEAD
              AllowedHeaders:
                - "*"
    InquiriesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: itfarmer-inquiries-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

  Outputs:
    ApiGatewayBaseUrl:
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${aws:region}.amazonaws.com/${self:provider.stage}"
    ContentBucketName:
      Value: !Ref ContentBucket
    InquiriesTableName:
      Value: !Ref InquiriesTable
